modLoader="javafml"
license="${mod_license}"
loaderVersion = "[47,)"
issueTrackerURL="https://github.com/zehmaria/createpickywheels/issues"
displayURL="https://github.com/zehmaria/createpickywheels"

[[mods]]
    modId="${mod_id}"
    version="${file.jarVersion}"
    displayName="${mod_name}"
    logoFile="logo.png"
    authors="${mod_author}"
    description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange = "[47.1.3,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange = "[6.0.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange = "[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"


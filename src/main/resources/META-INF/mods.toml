modLoader="javafml"
license="${mod_license}"
loaderVersion = "${loader_version_range}"
issueTrackerURL="https://github.com/zehmaria/createpickywheels/issues"
displayURL="https://github.com/zehmaria/createpickywheels"

[[mods]]
    modId="${mod_id}"
    version="${mod_long_version}"
    displayName="${mod_name}"
    logoFile="logo.png"
    authors="${mod_author}"
    description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="${create_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

